[project]
name = "experiment-reporter"
version = "0.1.0"
description = "Dependency-free SVG chart renderer for tech-playground experiment reports"
requires-python = ">=3.9"

[project.scripts]
experiment-reporter = "experiment_reporter.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
