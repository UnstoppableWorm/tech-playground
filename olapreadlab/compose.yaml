name: olap-read-lab

services:
  postgres:
    image: postgres:17.11-alpine
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - wal_keep_size=1024MB
      - -c
      - max_wal_size=8GB
      - -c
      - checkpoint_timeout=30min
    environment:
      POSTGRES_DB: olap_lab
      POSTGRES_USER: olap
      POSTGRES_PASSWORD: olap
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olap -d olap_lab"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  kafka:
    image: quay.io/debezium/kafka:3.6
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      NODE_ID: 1
      NODE_ROLE: combined
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    ports:
      - "29092:29092"
    volumes:
      - kafka-data:/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  debezium-connect:
    image: quay.io/debezium/connect:3.6
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: olap-read-lab-connect
      CONFIG_STORAGE_TOPIC: olap-read-lab-connect-configs
      OFFSET_STORAGE_TOPIC: olap-read-lab-connect-offsets
      STATUS_STORAGE_TOPIC: olap-read-lab-connect-statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8083/connectors >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  debezium-register:
    image: quay.io/debezium/connect:3.6
    entrypoint: ["/bin/bash", "/config/register.sh"]
    volumes:
      - ./infra/debezium:/config:ro
    depends_on:
      debezium-connect:
        condition: service_healthy
    restart: "no"

  clickhouse:
    image: clickhouse/clickhouse-server:26.3.20.7
    environment:
      CLICKHOUSE_DB: olap_clickhouse
      CLICKHOUSE_USER: olap
      CLICKHOUSE_PASSWORD: olap
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
      - ./infra/clickhouse/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "olap", "--password", "olap", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  postgres-data:
  kafka-data:
  clickhouse-data:
  clickhouse-logs:
