spring.application.name=olap-read-optimization-lab
spring.graphql.graphiql.enabled=true
spring.graphql.schema.printer.enabled=true
spring.batch.job.enabled=false

# 로컬 스모크 테스트용 기본 DB. 실제 실험에서는 프로필별 데이터소스로 교체한다.
spring.datasource.url=jdbc:h2:mem:olap-read-lab;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

clickhouse.datasource.url=jdbc:ch:http://localhost:8123/olap_clickhouse
clickhouse.datasource.username=olap
clickhouse.datasource.password=olap

management.endpoints.web.exposure.include=health,metrics

experiment.source-row-count=100000000
experiment.warmup-count=3
experiment.measurement-count=10
experiment.correction.target-row-count=100000
experiment.correction.completion-timeout=10m

experiment.first.source-row-count=100000000
experiment.first.backfill-row-count=10000000
experiment.first.clickhouse-block-sizes=1000000,100000,10000

# The HTTP benchmark is opt-in; Ansible supplies run-specific output and port values.
benchmark.enabled=false
benchmark.endpoint=http://127.0.0.1:18080/graphql
benchmark.output=build/benchmark/latest.json
benchmark.model=medical-history
benchmark.view=person-organ-disease-daily
benchmark.from-inclusive=2025-01-01T00:00:00Z
benchmark.to-exclusive=2026-01-01T00:00:00Z
benchmark.covered-until=2025-10-01T00:00:00Z
benchmark.source-row-count=${experiment.source-row-count}
benchmark.click-house-strategy=leaf
benchmark.click-house-block-size=100000
benchmark.modes=POSTGRES_RAW,POSTGRES_BATCH_HYBRID,CLICKHOUSE_HYBRID
benchmark.windows=ONE_DAY,ONE_MONTH,ONE_YEAR,ALL
benchmark.warmup-count=${experiment.warmup-count}
benchmark.measurement-count=${experiment.measurement-count}
benchmark.random-seed=20260907
benchmark.request-timeout=30m
