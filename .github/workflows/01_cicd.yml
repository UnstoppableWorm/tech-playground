name: regional-mac-mini-ansible-cicd

on:
  workflow_dispatch:
    inputs:
      region:
        description: 배포할 권역을 선택하세요
        required: true
        type: choice
        options:
          - 선택 필요
          - 내수
          - 유럽
          - 북미

permissions:
  contents: read

concurrency:
  group: regional-mac-mini-cicd-${{ inputs.region }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  delivery:
    name: Validate, test, build, and deploy
    runs-on: [self-hosted, Linux, ARM64, mac-mini-dind, kr, stg]
    timeout-minutes: 30
    env:
      DELIVERY_SCOPE_JSON: >-
        {"delivery_scope":{"country":"${{ inputs.region == '내수' && 'kr' || inputs.region == '유럽' && 'eu' || inputs.region == '북미' && 'na' || 'unsupported' }}","environment":"${{ github.ref_name == 'prd' && 'prd' || (github.ref_name == 'main' || github.ref_name == 'stg' || startsWith(github.ref_name, 'feature/')) && 'stg' || 'unsupported' }}"}}
    defaults:
      run:
        working-directory: ansible-delivery-template
    steps:
      - name: Check out the requested revision
        uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false

      - name: Require an explicit delivery region
        if: inputs.region == '선택 필요'
        run: |
          echo "::error::내수, 유럽, 북미 중 배포할 권역을 선택해야 합니다."
          exit 1

      - name: Validate delivery configuration
        run: ansible-playbook .github/ansible/playbooks/02_validate.yml --extra-vars "$DELIVERY_SCOPE_JSON"

      - name: Test the application
        run: ansible-playbook .github/ansible/playbooks/03_test.yml --extra-vars "$DELIVERY_SCOPE_JSON"

      - name: Build the application image
        run: ansible-playbook .github/ansible/playbooks/04_build.yml --extra-vars "$DELIVERY_SCOPE_JSON"

      - name: Deploy on the runner Docker engine
        run: ansible-playbook .github/ansible/playbooks/05_deploy.yml --extra-vars "$DELIVERY_SCOPE_JSON"
