- name: Build and publish release image
  hosts: "{{ target_group | default('deployment_target_group_required') }}"
  gather_facts: false
  tasks:
    - name: Build and push container image
      ansible.builtin.import_role:
        name: release_image
      vars:
        harbor_username: "{{ lookup('ansible.builtin.env', 'HARBOR_USERNAME') }}"
        harbor_password: "{{ lookup('ansible.builtin.env', 'HARBOR_PASSWORD') }}"
      delegate_to: localhost
      run_once: true
      when: not (deploy_only | default(false) | bool)

- name: Deploy selected target group
  hosts: "{{ target_group | default('deployment_target_group_required') }}"
  gather_facts: false
  serial: "{{ deploy_serial | default('100%') }}"
  tasks:
    - name: Deploy release image
      ansible.builtin.import_role:
        name: deploy_app
      vars:
        harbor_username: "{{ lookup('ansible.builtin.env', 'HARBOR_USERNAME') }}"
        harbor_password: "{{ lookup('ansible.builtin.env', 'HARBOR_PASSWORD') }}"
