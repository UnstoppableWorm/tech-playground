<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ansible Delivery Template</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top, #eef6ff, #ffffff 45%),
          linear-gradient(135deg, #f5f9ff, #ffffff);
        color: #183153;
      }

      main {
        width: min(680px, calc(100% - 48px));
        padding: 40px;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 24px 80px rgba(24, 49, 83, 0.12);
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 5vw, 3.4rem);
      }

      p {
        margin: 0;
        font-size: 1.05rem;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>GitHub Actions + Ansible Delivery</h1>
      <p>
        This placeholder container exists so the pipeline can build and deploy
        something real. Replace the sample Docker image with your service when
        you wire the template into an application repository.
      </p>
    </main>
  </body>
</html>
