name: release-and-deploy

on:
  workflow_dispatch:
    inputs:
      deployment_target:
        description: Inventory group to deploy
        required: true
        type: choice
        options:
          - north_america_validation
          - north_america_production
          - europe_validation
          - europe_production
          - domestic_validation
          - domestic_production
      release_tag:
        description: Container tag to publish and deploy
        required: false
        default: ""
      deploy_only:
        description: Skip image build and only deploy an existing tag
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.deployment_target }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.deployment_target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.deployment_target }}
    env:
      ANSIBLE_FORCE_COLOR: "true"
      PY_COLORS: "1"
      TARGET_GROUP: ${{ inputs.deployment_target }}
      RELEASE_TAG: ${{ inputs.release_tag != '' && inputs.release_tag || github.sha }}
      DEPLOY_ONLY: ${{ inputs.deploy_only }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Ansible
        working-directory: ansible-delivery-template
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core==2.17.7

      - name: Prepare SSH material
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Execute release playbook
        working-directory: ansible-delivery-template
        env:
          ANSIBLE_HOST_KEY_CHECKING: "true"
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          ansible-playbook playbooks/release.yml \
            -e target_group="$TARGET_GROUP" \
            -e release_tag="$RELEASE_TAG" \
            -e deploy_only="$DEPLOY_ONLY"
