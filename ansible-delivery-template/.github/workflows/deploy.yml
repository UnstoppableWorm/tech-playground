name: Deploy stage

on:
  workflow_call:
    inputs:
      country:
        required: true
        type: string
      deploy_env:
        required: true
        type: string
      image_version:
        required: true
        type: string

jobs:
  deploy:
    name: Deploy (${{ inputs.country }}/${{ inputs.deploy_env }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment:
      name: ${{ inputs.country }}-${{ inputs.deploy_env }}
    env:
      ANSIBLE_FORCE_COLOR: "true"
      PY_COLORS: "1"
      ANSIBLE_CONFIG: .cicd/ansible/ansible.cfg
      DEPLOY_COUNTRY: ${{ inputs.country }}
      DEPLOY_ENV: ${{ inputs.deploy_env }}
      IMAGE_VERSION: ${{ inputs.image_version }}
      GITHUB_TOKEN: ${{ github.token }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ansible
      - name: Prepare SSH access
        run: |
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -m 700 -d "$RUNNER_TEMP/deploy-ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/deploy-ssh/id_rsa"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/deploy-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/deploy-ssh/id_rsa"
          printf 'ANSIBLE_PRIVATE_KEY_FILE=%s\n' "$RUNNER_TEMP/deploy-ssh/id_rsa" >> "$GITHUB_ENV"
          printf 'ANSIBLE_SSH_ARGS=%s\n' "-o UserKnownHostsFile=$RUNNER_TEMP/deploy-ssh/known_hosts -o StrictHostKeyChecking=yes" >> "$GITHUB_ENV"
      - name: Deploy the requested image version
        run: ansible-playbook .cicd/ansible/playbooks/deploy.yml
