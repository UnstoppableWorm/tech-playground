name: validate-cicd-template

on:
  pull_request:
    paths:
      - .cicd/**
      - .github/actions/**
      - .github/workflows/**
      - Dockerfile
      - static/**
  push:
    branches:
      - main
    paths:
      - .cicd/**
      - .github/actions/**
      - .github/workflows/**
      - Dockerfile
      - static/**

permissions:
  contents: read

jobs:
  syntax:
    name: Validate ${{ matrix.country }}-${{ matrix.deploy_env }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        country:
          - kr
          - eu
          - na
        deploy_env:
          - stg
          - prd
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ansible
        uses: ./.github/actions/setup-ansible

      - name: Validate inventory and playbook syntax
        env:
          DEPLOY_COUNTRY: ${{ matrix.country }}
          DEPLOY_ENV: ${{ matrix.deploy_env }}
          IMAGE_VERSION: v1.syntax-check
          REGISTRY_NAMESPACE: validation
          REGISTRY_USERNAME: validation
          REGISTRY_TOKEN: validation
        run: |
          export ANSIBLE_CONFIG=.cicd/ansible/ansible.cfg
          ansible-inventory --graph
          for playbook in test build deploy; do
            ansible-playbook ".cicd/ansible/playbooks/${playbook}.yml" --syntax-check
          done
