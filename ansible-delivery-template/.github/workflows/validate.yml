name: validate-template

on:
  pull_request:
    paths:
      - ansible-delivery-template/**
  push:
    branches:
      - main
    paths:
      - ansible-delivery-template/**

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Ansible
        working-directory: ansible-delivery-template
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core==2.17.7

      - name: Inventory graph
        working-directory: ansible-delivery-template
        run: ansible-inventory --graph

      - name: Syntax check
        working-directory: ansible-delivery-template
        run: ansible-playbook playbooks/release.yml --syntax-check -e target_group=north_america_validation
