name: validate-cicd-template

on:
  pull_request:
    paths:
      - .cicd/**
      - .github/workflows/**
      - Dockerfile
      - static/**
  push:
    branches:
      - main
    paths:
      - .cicd/**
      - .github/workflows/**
      - Dockerfile
      - static/**

permissions:
  contents: read

jobs:
  syntax:
    name: Validate ${{ matrix.country }}-${{ matrix.deploy_env }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        country:
          - kr
          - eu
          - na
        deploy_env:
          - stg
          - prd
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible-core==2.17.7

      - name: Validate inventory and playbook syntax
        env:
          COUNTRY: ${{ matrix.country }}
          DEPLOY_ENV: ${{ matrix.deploy_env }}
        run: |
          export ANSIBLE_CONFIG=.cicd/ansible/ansible.cfg
          ansible-inventory --graph
          for playbook in build deploy; do
            ansible-playbook ".cicd/ansible/playbooks/${playbook}.yml" --syntax-check -e "country=${COUNTRY}" -e "deploy_env=${DEPLOY_ENV}" -e "image_version=syntax-check" -e "@.cicd/pipeline/${COUNTRY}.yml" -e "@.cicd/vars/${DEPLOY_ENV}.yml" -e "@.cicd/ansible/vars/${COUNTRY}/${DEPLOY_ENV}.yml"
          done
