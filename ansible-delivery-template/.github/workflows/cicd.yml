name: regional-ansible-cicd

on:
  push:
    branches:
      - "feature/**"
      - stg
      - prd
  workflow_dispatch:
    inputs:
      country:
        description: Deployment country / region
        required: true
        type: choice
        options: [kr, eu, na]
      deploy_env:
        description: Deployment environment
        required: true
        type: choice
        options: [stg, prd]

permissions:
  contents: read

env:
  ANSIBLE_FORCE_COLOR: "true"
  PY_COLORS: "1"
  ANSIBLE_CONFIG: .cicd/ansible/ansible.cfg
  DEPLOY_COUNTRY: ${{ inputs.country || 'kr' }}
  DEPLOY_ENV: ${{ inputs.deploy_env || (github.ref_name == 'prd' && 'prd' || 'stg') }}
  IMAGE_VERSION: v1.${{ github.run_number }}

concurrency:
  group: regional-cicd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup-ansible
      - name: Run configured tests
        run: ansible-playbook .cicd/ansible/playbooks/test.yml

  build:
    name: Build and push image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: ./.github/actions/setup-ansible
      - name: Build and publish the configured image
        run: ansible-playbook .cicd/ansible/playbooks/build.yml

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment:
      name: ${{ format('{0}-{1}', inputs.country || 'kr', inputs.deploy_env || (github.ref_name == 'prd' && 'prd' || 'stg')) }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
    steps:
      - uses: ./.github/actions/setup-ansible
      - name: Prepare SSH access
        run: |
          install -m 700 -d "$RUNNER_TEMP/deploy-ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/deploy-ssh/id_rsa"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/deploy-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/deploy-ssh/id_rsa"
          printf 'ANSIBLE_PRIVATE_KEY_FILE=%s\n' "$RUNNER_TEMP/deploy-ssh/id_rsa" >> "$GITHUB_ENV"
          printf 'ANSIBLE_SSH_ARGS=%s\n' "-o UserKnownHostsFile=$RUNNER_TEMP/deploy-ssh/known_hosts -o StrictHostKeyChecking=yes" >> "$GITHUB_ENV"
      - name: Deploy the requested image version
        run: ansible-playbook .cicd/ansible/playbooks/deploy.yml
