name: regional-ansible-cicd

on:
  workflow_dispatch:
    inputs:
      country:
        description: Deployment country / region
        required: true
        type: choice
        options:
          - kr
          - eu
          - na
      deploy_env:
        description: Deployment environment
        required: true
        type: choice
        options:
          - stg
          - prd
      release_mode:
        description: Build a new image or deploy an existing one
        required: true
        type: choice
        default: build_and_deploy
        options:
          - build_and_deploy
          - deploy_only
      release_tag:
        description: Harbor image tag; defaults to the Git commit SHA
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: regional-cicd-${{ inputs.country }}-${{ inputs.deploy_env }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve environment metadata
    runs-on: ubuntu-latest
    outputs:
      build_runner: ${{ steps.metadata.outputs.build_runner }}
      deploy_runner: ${{ steps.metadata.outputs.deploy_runner }}
      build_job_name: ${{ steps.metadata.outputs.build_job_name }}
      deploy_job_name: ${{ steps.metadata.outputs.deploy_job_name }}
      country_var_root: ${{ steps.metadata.outputs.country_var_root }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read runner metadata
        id: metadata
        env:
          COUNTRY: ${{ inputs.country }}
          DEPLOY_ENV: ${{ inputs.deploy_env }}
        run: |
          set -euo pipefail
          case "$COUNTRY" in kr|eu|na) ;; *) exit 1 ;; esac
          case "$DEPLOY_ENV" in stg|prd) ;; *) exit 1 ;; esac

          metadata_file=".cicd/vars/${DEPLOY_ENV}.yml"
          pipeline_file=".cicd/pipeline/${COUNTRY}.yml"
          build_runner="$(sed -n 's/^build_runner:[[:space:]]*//p' "$metadata_file")"
          deploy_runner="$(sed -n 's/^deploy_runner:[[:space:]]*//p' "$metadata_file")"
          pipeline_country="$(sed -n 's/^  country:[[:space:]]*//p' "$pipeline_file")"
          build_job_name="$(sed -n 's/^  build_job_name:[[:space:]]*//p' "$pipeline_file")"
          deploy_job_name="$(sed -n 's/^  deploy_job_name:[[:space:]]*//p' "$pipeline_file")"
          country_var_root="$(sed -n 's/^  ansible_var_root:[[:space:]]*//p' "$pipeline_file")"

          test -n "$build_runner"
          test -n "$deploy_runner"
          test "$pipeline_country" = "$COUNTRY"
          test -n "$build_job_name"
          test -n "$deploy_job_name"
          test -n "$country_var_root"
          printf 'build_runner=%s\n' "$build_runner" >> "$GITHUB_OUTPUT"
          printf 'deploy_runner=%s\n' "$deploy_runner" >> "$GITHUB_OUTPUT"
          printf 'build_job_name=%s\n' "$build_job_name" >> "$GITHUB_OUTPUT"
          printf 'deploy_job_name=%s\n' "$deploy_job_name" >> "$GITHUB_OUTPUT"
          printf 'country_var_root=%s\n' "$country_var_root" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ needs.resolve.outputs.build_job_name }} (${{ inputs.deploy_env }})
    needs: resolve
    if: ${{ inputs.release_mode == 'build_and_deploy' }}
    runs-on: ${{ needs.resolve.outputs.build_runner }}
    timeout-minutes: 30
    environment:
      name: ${{ format('{0}-{1}', inputs.country, inputs.deploy_env) }}
    env:
      ANSIBLE_FORCE_COLOR: "true"
      PY_COLORS: "1"
      COUNTRY: ${{ inputs.country }}
      DEPLOY_ENV: ${{ inputs.deploy_env }}
      COUNTRY_VAR_ROOT: ${{ needs.resolve.outputs.country_var_root }}
      RELEASE_TAG: ${{ inputs.release_tag != '' && inputs.release_tag || github.sha }}
      HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
      HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible-core==2.17.7

      - name: Build and push the release image
        run: |
          export ANSIBLE_CONFIG=.cicd/ansible/ansible.cfg
          ansible-playbook .cicd/ansible/playbooks/build.yml -e "country=${COUNTRY}" -e "deploy_env=${DEPLOY_ENV}" -e "release_tag=${RELEASE_TAG}" -e "project_root=${GITHUB_WORKSPACE}" -e "@.cicd/pipeline/${COUNTRY}.yml" -e "@.cicd/vars/${DEPLOY_ENV}.yml" -e "@${COUNTRY_VAR_ROOT}/${DEPLOY_ENV}.yml"

  deploy:
    name: ${{ needs.resolve.outputs.deploy_job_name }} (${{ inputs.deploy_env }})
    needs:
      - resolve
      - build
    if: >-
      ${{
        always()
        && needs.resolve.result == 'success'
        && (inputs.release_mode == 'deploy_only' || needs.build.result == 'success')
      }}
    runs-on: ${{ needs.resolve.outputs.deploy_runner }}
    timeout-minutes: 30
    environment:
      name: ${{ format('{0}-{1}', inputs.country, inputs.deploy_env) }}
    env:
      ANSIBLE_FORCE_COLOR: "true"
      PY_COLORS: "1"
      COUNTRY: ${{ inputs.country }}
      DEPLOY_ENV: ${{ inputs.deploy_env }}
      COUNTRY_VAR_ROOT: ${{ needs.resolve.outputs.country_var_root }}
      RELEASE_TAG: ${{ inputs.release_tag != '' && inputs.release_tag || github.sha }}
      HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
      HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible-core==2.17.7

      - name: Prepare SSH access
        run: |
          set -euo pipefail
          ssh_material_dir="${RUNNER_TEMP}/deploy-ssh"
          install -m 700 -d "$ssh_material_dir"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$ssh_material_dir/id_rsa"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$ssh_material_dir/known_hosts"
          chmod 600 "$ssh_material_dir/id_rsa"
          printf 'ANSIBLE_PRIVATE_KEY_FILE=%s\n' "$ssh_material_dir/id_rsa" >> "$GITHUB_ENV"
          printf 'ANSIBLE_SSH_ARGS=%s\n' "-o UserKnownHostsFile=$ssh_material_dir/known_hosts -o StrictHostKeyChecking=yes" >> "$GITHUB_ENV"

      - name: Pull and deploy the release image
        run: |
          export ANSIBLE_CONFIG=.cicd/ansible/ansible.cfg
          ansible-playbook .cicd/ansible/playbooks/deploy.yml -e "country=${COUNTRY}" -e "deploy_env=${DEPLOY_ENV}" -e "release_tag=${RELEASE_TAG}" -e "@.cicd/pipeline/${COUNTRY}.yml" -e "@.cicd/vars/${DEPLOY_ENV}.yml" -e "@${COUNTRY_VAR_ROOT}/${DEPLOY_ENV}.yml"
