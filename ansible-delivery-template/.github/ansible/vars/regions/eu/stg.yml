---
build:
  arguments:
    REGION_PARAMETER: EU

deploy:
  spring_profile: "eu,stg"
  restart_policy: unless-stopped
  stabilize_seconds: 0
  cleanup:
    remove_previous_image: true
    prune_dangling_images: false
  environment:
    APP_RUNTIME_MODE: verification
    LOG_LEVEL: DEBUG
    TZ: Europe/Berlin
    APP_REGION: eu
    APP_BASE_URL: https://stg-eu.example.com
  volumes:
    - /var/log/delivery-template-eu-stg:/app/log
  targets:
    - name: app-1
      port_mapping: "18081:8080"
      environment:
        APM_TARGET_NAME: DELIVERY_TEMPLATE_EU_STG_01
      volumes: []
