build_name: delivery-template-na-prd
region_param: NA
spring_profile: "na,prd"

docker_registry: ghcr.io
dockerfile: Dockerfile

target_servers:
  - name: na-prd-app-1
    host: na-prd-app-1.example.internal
    extra_env:
      APM_TARGET_NAME: DELIVERY_TEMPLATE_NA_PRD_01
  - name: na-prd-app-2
    host: na-prd-app-2.example.internal
    extra_env:
      APM_TARGET_NAME: DELIVERY_TEMPLATE_NA_PRD_02

port_mapping: "8080:8080"
restart_policy: always

extra_volumes:
  - /var/log/delivery-template:/app/log

extra_env:
  TZ: America/Toronto
  APP_REGION: na
  APP_BASE_URL: https://na.example.com

health_check_port: 8080
health_check_path: /actuator/health
stabilize_seconds: 15
