build_name: delivery-template-kr-stg
region_param: KR
spring_profile: "kr,stg"

docker_registry: ghcr.io
registry_namespace: unstoppableworm
dockerfile: Dockerfile

target_servers:
  - name: kr-stg-app-1
    host: kr-stg-app-1.example.internal
    extra_env:
      APM_TARGET_NAME: DELIVERY_TEMPLATE_KR_STG_01

port_mapping: "18080:8080"
restart_policy: unless-stopped

extra_volumes:
  - /var/log/delivery-template:/app/log

extra_env:
  TZ: Asia/Seoul
  APP_REGION: kr
  APP_BASE_URL: https://stg-kr.example.com

health_check_port: 18080
health_check_path: /actuator/health
stabilize_seconds: 0
