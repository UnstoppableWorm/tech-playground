[defaults]
inventory = hosts.yml
collections_path = ../../.ansible/collections
# Deployment targets are added by deploy.yml at runtime.
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent
timeout = 30
# This path is relative to this ansible.cfg file, not the caller's CWD.
local_tmp = ../../.ansible/tmp

[ssh_connection]
pipelining = True
