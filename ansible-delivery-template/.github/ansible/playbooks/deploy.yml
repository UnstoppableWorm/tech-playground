---
# Shared deployment template. target_servers is converted to a runtime SSH inventory.
- name: Register country-specific target servers
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    country: "{{ lookup('ansible.builtin.env', 'DEPLOY_COUNTRY') | lower }}"
    deploy_env: "{{ lookup('ansible.builtin.env', 'DEPLOY_ENV') | lower }}"
    image_version: "{{ lookup('ansible.builtin.env', 'IMAGE_VERSION') }}"
    registry_namespace: >-
      {{
        lookup('ansible.builtin.env', 'REGISTRY_NAMESPACE')
        | default(lookup('ansible.builtin.env', 'GITHUB_REPOSITORY_OWNER'), true)
      }}
    dynamic_target_group: "delivery_{{ country }}_{{ deploy_env }}"
    deployment_ssh_private_key: "{{ lookup('ansible.builtin.env', 'SSH_PRIVATE_KEY') }}"
    deployment_ssh_known_hosts: "{{ lookup('ansible.builtin.env', 'SSH_KNOWN_HOSTS') }}"
    controller_project_root: >-
      {{
        lookup('ansible.builtin.env', 'PROJECT_ROOT')
        | default(lookup('ansible.builtin.env', 'GITHUB_WORKSPACE'), true)
        | default(playbook_dir ~ '/../../..', true)
      }}
    controller_runtime_dir: >-
      {{
        lookup('ansible.builtin.env', 'RUNNER_TEMP')
        | default(lookup('ansible.builtin.env', 'TMPDIR'), true)
        | default('/tmp', true)
      }}
    # Only controller tasks use this path; target VMs keep their own remote_tmp.
    ansible_remote_tmp: "{{ controller_project_root }}/.ansible/remote_tmp"
  vars_files:
    - "{{ playbook_dir }}/../vars/environments/{{ lookup('ansible.builtin.env', 'DEPLOY_ENV') | lower }}.yml"
    - "{{ playbook_dir }}/../vars/regions/{{ lookup('ansible.builtin.env', 'DEPLOY_COUNTRY') | lower }}/{{ lookup('ansible.builtin.env', 'DEPLOY_ENV') | lower }}.yml"
  pre_tasks:
    - name: Validate selected country, environment, and target servers
      ansible.builtin.assert:
        that:
          - country in ['kr', 'eu', 'na']
          - deploy_env in ['stg', 'prd']
          - deployment_environment.code == deploy_env
          - build_name | default('') | length > 0
          - docker_registry | default('') | length > 0
          - registry_namespace | default('') | length > 0
          - target_servers | default([]) | length > 0
          - port_mapping | default('') | length > 0
          - restart_policy | default('') in ['always', 'unless-stopped', 'on-failure', 'no']
          - spring_profile | default('') | length > 0
          - health_check_port | default(0) | int > 0
          - deployment_ssh is defined
          - deployment_ssh.user | default('', true) | length > 0
          - deployment_ssh.port | default(0, true) | int > 0
          - deployment_ssh_private_key | length > 0
          - deployment_ssh_known_hosts | length > 0
        fail_msg: Check country, deploy environment, registry settings, target_servers, and deployment SSH secrets.
  tasks:
    - name: Create protected controller SSH material directory
      ansible.builtin.tempfile:
        state: directory
        path: "{{ controller_runtime_dir }}"
        prefix: ansible-deploy-
      register: controller_ssh_directory
      no_log: true

    - name: Write the deployment private key on the controller
      ansible.builtin.copy:
        content: "{{ deployment_ssh_private_key | trim }}\n"
        dest: "{{ controller_ssh_directory.path }}/id_rsa"
        mode: "0600"
      no_log: true

    - name: Write known hosts on the controller
      ansible.builtin.copy:
        content: "{{ deployment_ssh_known_hosts | trim }}\n"
        dest: "{{ controller_ssh_directory.path }}/known_hosts"
        mode: "0600"
      no_log: true

    - name: Save the controller SSH material paths
      ansible.builtin.set_fact:
        controller_ssh_material_directory: "{{ controller_ssh_directory.path }}"
        controller_ssh_private_key_file: "{{ controller_ssh_directory.path }}/id_rsa"
        controller_ssh_known_hosts_file: "{{ controller_ssh_directory.path }}/known_hosts"

    - name: Add each configured server to the runtime inventory
      ansible.builtin.add_host:
        name: "{{ item.name | default(item.host, true) }}"
        groups: "{{ dynamic_target_group }}"
        ansible_host: "{{ item.host }}"
        ansible_user: "{{ deployment_ssh.user }}"
        ansible_port: "{{ deployment_ssh.port }}"
        ansible_ssh_private_key_file: "{{ controller_ssh_private_key_file }}"
        ansible_ssh_common_args: >-
          -o UserKnownHostsFile={{ controller_ssh_known_hosts_file }}
          -o StrictHostKeyChecking=yes
        deployment_target_name: "{{ item.name | default(item.host, true) }}"
        server_extra_env: "{{ item.extra_env | default({}) }}"
        server_extra_volumes: "{{ item.extra_volumes | default([]) }}"
      loop: "{{ target_servers }}"
      loop_control:
        label: "{{ item.name | default(item.host, true) }}"

- name: Deploy a country-specific release to registered target servers
  hosts: "delivery_{{ lookup('ansible.builtin.env', 'DEPLOY_COUNTRY') | lower }}_{{ lookup('ansible.builtin.env', 'DEPLOY_ENV') | lower }}"
  gather_facts: false
  serial: "{{ deployment_environment.deploy_serial | default(1) }}"
  vars:
    country: "{{ lookup('ansible.builtin.env', 'DEPLOY_COUNTRY') | lower }}"
    deploy_env: "{{ lookup('ansible.builtin.env', 'DEPLOY_ENV') | lower }}"
    image_version: "{{ lookup('ansible.builtin.env', 'IMAGE_VERSION') }}"
    registry_namespace: >-
      {{
        lookup('ansible.builtin.env', 'REGISTRY_NAMESPACE')
        | default(lookup('ansible.builtin.env', 'GITHUB_REPOSITORY_OWNER'), true)
      }}
    registry_username: >-
      {{
        lookup('ansible.builtin.env', 'REGISTRY_USERNAME')
        | default(lookup('ansible.builtin.env', 'GITHUB_ACTOR'), true)
      }}
    registry_token: >-
      {{
        lookup('ansible.builtin.env', 'REGISTRY_TOKEN')
        | default(lookup('ansible.builtin.env', 'GITHUB_TOKEN'), true)
      }}
  vars_files:
    - "{{ playbook_dir }}/../vars/environments/{{ lookup('ansible.builtin.env', 'DEPLOY_ENV') | lower }}.yml"
    - "{{ playbook_dir }}/../vars/regions/{{ lookup('ansible.builtin.env', 'DEPLOY_COUNTRY') | lower }}/{{ lookup('ansible.builtin.env', 'DEPLOY_ENV') | lower }}.yml"
  pre_tasks:
    - name: Validate the deployment context and registry credentials
      ansible.builtin.assert:
        that:
          - country in ['kr', 'eu', 'na']
          - deploy_env in ['stg', 'prd']
          - build_name | default('') | length > 0
          - docker_registry | default('') | length > 0
          - registry_namespace | default('') | length > 0
          - spring_profile | default('') | length > 0
          - image_version | default('') is match('^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$')
          - registry_username | default('') | length > 0
          - registry_token | default('') | length > 0
        fail_msg: Check image version, registry settings, and registry credentials.
  tasks:
    - name: Resolve the requested versioned image and container names
      ansible.builtin.set_fact:
        release_image: "{{ docker_registry | lower }}/{{ registry_namespace | lower }}/{{ build_name | lower }}:{{ image_version }}"
        deployed_container_name: "{{ build_name }}-{{ deployment_target_name }}"
        deployment_network_name: "{{ build_name }}-{{ deployment_target_name }}-network"

    - name: Deploy the current target server
      ansible.builtin.include_tasks: deploy_single_server.yml

- name: Remove controller SSH material after deployment
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_remote_tmp: "{{ playbook_dir }}/../../../.ansible/remote_tmp"
  tasks:
    - name: Remove the temporary deployment SSH directory
      ansible.builtin.file:
        path: "{{ controller_ssh_material_directory }}"
        state: absent
      when: controller_ssh_material_directory is defined
      no_log: true
