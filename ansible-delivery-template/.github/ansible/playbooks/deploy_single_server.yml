---
# Included by deploy.yml once for every server declared in target_servers.
# The target is reached through SSH; Docker Remote API port 2375 is not exposed.
- name: Announce the requested image for the current target
  ansible.builtin.debug:
    msg: "Deploying {{ release_image }} to {{ country }}/{{ deploy_env }} on {{ deployment_target_name }}."

- name: Verify the Docker API is available on the target VM
  community.docker.docker_host_info:

- name: Login to the container registry from the target VM
  community.docker.docker_login:
    registry_url: "{{ docker_registry }}"
    username: "{{ registry_username }}"
    password: "{{ registry_token }}"
    reauthorize: true
  no_log: true

- name: Pull the requested immutable image version
  community.docker.docker_image:
    name: "{{ release_image }}"
    state: present
    source: pull
    force_source: true

- name: Read the pulled image ID
  community.docker.docker_image_info:
    name: "{{ release_image }}"
  register: requested_image

- name: Stop when the requested image is not available on the target
  ansible.builtin.assert:
    that:
      - requested_image.images | length == 1
    fail_msg: "Image {{ release_image }} is missing after the pull."

- name: Read the image ID used by the current target container
  community.docker.docker_container_info:
    name: "{{ deployed_container_name }}"
  register: current_target_container

- name: Merge country, environment, and server runtime values
  ansible.builtin.set_fact:
    runtime_container_env: >-
      {{
        {
          'DEPLOYMENT_TARGET': deployment_target_name,
          'DEPLOYMENT_COUNTRY': country,
          'DEPLOYMENT_ENVIRONMENT': deploy_env,
          'RELEASE_IMAGE': release_image,
          'IMAGE_VERSION': image_version,
          'APP_NAME': build_name,
          'APP_COUNTRY': country,
          'APP_ENV': deploy_env,
          'SPRING_PROFILES_ACTIVE': spring_profile
        }
        | combine(deployment_environment.runtime_env | default({}))
        | combine(extra_env | default({}))
        | combine(server_extra_env | default({}))
      }}
    resolved_extra_volumes: >-
      {{
        (extra_volumes | default([]))
        + (server_extra_volumes | default([]))
      }}

- name: Ensure the service network exists
  community.docker.docker_network:
    name: "{{ deployment_network_name }}"
    state: present

- name: Recreate the service with the requested image version
  community.docker.docker_container:
    name: "{{ deployed_container_name }}"
    image: "{{ release_image }}"
    state: started
    detach: true
    recreate: true
    pull: never
    restart_policy: "{{ restart_policy }}"
    env: "{{ runtime_container_env }}"
    published_ports:
      - "{{ port_mapping }}"
    volumes: "{{ resolved_extra_volumes }}"
    labels:
      deployment.country: "{{ country }}"
      deployment.environment: "{{ deploy_env }}"
      deployment.target: "{{ deployment_target_name }}"
      deployment.image-version: "{{ image_version }}"
    networks:
      - name: "{{ deployment_network_name }}"
    networks_cli_compatible: true

- name: Wait for the recreated service port
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ health_check_port }}"
    state: started
    delay: 2
    timeout: 120

- name: Wait for the new release health endpoint
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ health_check_port }}{{ health_check_path | default('/') }}"
    method: GET
    status_code: 200
  register: deployment_healthcheck
  retries: 18
  delay: 5
  until: deployment_healthcheck.status == 200

- name: Remove the previous target image after the new release is healthy
  community.docker.docker_image:
    name: "{{ current_target_container.container.Image }}"
    state: absent
  register: previous_image_removal
  failed_when: false
  when:
    - deployment_environment.remove_previous_image | bool
    - current_target_container.exists
    - current_target_container.container.Image != requested_image.images[0].Id

- name: Prune stale dangling images according to environment policy
  community.docker.docker_prune:
    images: true
    images_filters:
      dangling: true
      until: 168h
  when: deployment_environment.docker_image_prune | bool

- name: Stabilize before the next target server
  ansible.builtin.pause:
    seconds: "{{ stabilize_seconds | default(0) | int }}"
  when:
    - stabilize_seconds | default(0) | int > 0
    - inventory_hostname != (ansible_play_hosts_all | last)

- name: Report the deployed image version
  ansible.builtin.debug:
    msg: "Deployed {{ release_image }} to {{ country }}/{{ deploy_env }} on {{ deployment_target_name }}."
