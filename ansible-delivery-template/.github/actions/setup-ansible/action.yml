name: Setup Ansible
description: Install the pinned Ansible runtime after the caller checks out the repository.

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install ansible-core==2.17.7 requests
        ANSIBLE_CONFIG=.github/ansible/ansible.cfg ansible-galaxy collection install \
          --requirements-file .github/ansible/requirements.yml \
          --collections-path .ansible/collections
