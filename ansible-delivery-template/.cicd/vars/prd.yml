test_runner: ubuntu-latest
build_runner: ubuntu-latest
deploy_runner: ubuntu-latest

container_registry:
  host: ghcr.io
  namespace: "{{ registry_namespace | default('', true) }}"

test_stage:
  command:
    - sh
    - -ec
    - |
      test -f Dockerfile
      test -f static/index.html
      grep -q "GitHub Actions + Ansible Delivery" static/index.html

deployment_environment:
  code: prd
  deploy_serial: 1
  remove_previous_image: true
  docker_image_prune: true
  runtime_env:
    APP_RUNTIME_MODE: production
    LOG_LEVEL: INFO
