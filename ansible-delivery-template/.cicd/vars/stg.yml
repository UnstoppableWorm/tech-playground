test_runner: ubuntu-latest
build_runner: ubuntu-latest
deploy_runner: ubuntu-latest

project_name: delivery-template-stg

deployment_ssh:
  user: deploy
  port: 22

test_stage:
  command:
    - sh
    - -ec
    - |
      test -f Dockerfile
      test -f static/index.html
      grep -q "GitHub Actions + Ansible Delivery" static/index.html

deployment_environment:
  code: stg
  deploy_serial: 1
  remove_previous_image: true
  docker_image_prune: false
  runtime_env:
    APP_RUNTIME_MODE: verification
    LOG_LEVEL: DEBUG
