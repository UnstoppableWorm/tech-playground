- name: Validate build context
  ansible.builtin.assert:
    that:
      - pipeline.country == country
      - deployment_environment.code == deploy_env
      - release.app_name | length > 0
      - release.harbor.registry | length > 0
      - release.harbor.project | length > 0
      - release.image_name | length > 0
      - release_tag | default('') | length > 0
      - harbor_username | default('') | length > 0
      - harbor_password | default('') | length > 0
    fail_msg: Check country, deploy environment, Harbor secrets, and image metadata.

- name: Resolve image and source paths
  ansible.builtin.set_fact:
    resolved_project_root: "{{ project_root | default(playbook_dir ~ '/../../..', true) }}"
    resolved_dockerfile_path: "{{ (project_root | default(playbook_dir ~ '/../../..', true)) }}/Dockerfile"
    release_image: "{{ release.harbor.registry }}/{{ release.harbor.project }}/{{ release.image_name }}:{{ release_tag }}"

- name: Ensure Dockerfile exists
  ansible.builtin.stat:
    path: "{{ resolved_dockerfile_path }}"
  register: dockerfile_stat

- name: Stop when the build context is incomplete
  ansible.builtin.assert:
    that:
      - dockerfile_stat.stat.exists
    fail_msg: "Dockerfile not found at {{ resolved_dockerfile_path }}."

- name: Verify Docker is available on the build runner
  ansible.builtin.command:
    argv:
      - docker
      - version
  changed_when: false

- name: Login to Harbor from the build runner
  ansible.builtin.command:
    argv:
      - docker
      - login
      - "{{ release.harbor.registry }}"
      - --username
      - "{{ harbor_username }}"
      - --password-stdin
    stdin: "{{ harbor_password }}"
  no_log: true
  changed_when: true

- name: Build release image with the runner Docker client
  ansible.builtin.command:
    argv:
      - docker
      - build
      - --pull
      - --file
      - "{{ resolved_dockerfile_path }}"
      - --tag
      - "{{ release_image }}"
      - "{{ resolved_project_root }}"
  changed_when: true

- name: Push release image to Harbor
  ansible.builtin.command:
    argv:
      - docker
      - push
      - "{{ release_image }}"
  changed_when: true
