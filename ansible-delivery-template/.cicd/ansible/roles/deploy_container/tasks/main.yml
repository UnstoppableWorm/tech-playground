- name: Validate deployment context
  ansible.builtin.assert:
    that:
      - pipeline.country == country
      - deployment_environment.code == deploy_env
      - target.group in group_names
      - target.deployment_root | length > 0
      - release.app_name | length > 0
      - release.harbor.registry | length > 0
      - release.harbor.project | length > 0
      - release.image_name | length > 0
      - release_tag | default('') | length > 0
      - harbor_username | default('') | length > 0
      - harbor_password | default('') | length > 0
    fail_msg: Check country, deploy environment, inventory target, Harbor secrets, and image metadata.

- name: Resolve release paths and image
  ansible.builtin.set_fact:
    deployment_root: "{{ target.deployment_root }}"
    compose_file_path: "{{ target.deployment_root }}/docker-compose.yml"
    runtime_env_file_path: "{{ target.deployment_root }}/app.env"
    release_image: "{{ release.harbor.registry }}/{{ release.harbor.project }}/{{ release.image_name }}:{{ release_tag }}"

- name: Verify Docker is available on the target VM
  ansible.builtin.command:
    argv:
      - docker
      - version
  changed_when: false

- name: Detect Docker Compose v2 plugin
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - version
  register: compose_v2
  failed_when: false
  changed_when: false

- name: Detect legacy docker-compose binary when needed
  ansible.builtin.command:
    argv:
      - docker-compose
      - version
  register: compose_v1
  when: compose_v2.rc != 0
  failed_when: false
  changed_when: false

- name: Require a supported Compose command
  ansible.builtin.assert:
    that:
      - compose_v2.rc == 0 or (compose_v1.rc | default(1)) == 0
    fail_msg: Install either the Docker Compose v2 plugin or the docker-compose binary on this VM.

- name: Select the Compose command supported by this VM
  ansible.builtin.set_fact:
    compose_command_argv: "{{ ['docker', 'compose'] if compose_v2.rc == 0 else ['docker-compose'] }}"

- name: Ensure deployment directory exists
  ansible.builtin.file:
    path: "{{ deployment_root }}"
    state: directory
    mode: "0755"

- name: Merge runtime environment variables
  ansible.builtin.set_fact:
    merged_runtime_env: >-
      {{
        {
          'APP_NAME': release.app_name,
          'APP_COUNTRY': country,
          'APP_ENV': deploy_env,
          'RELEASE_IMAGE': release_image
        }
        | combine(deployment_environment.runtime_env | default({}))
        | combine(release.runtime_env | default({}))
      }}

- name: Render Compose manifest
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../templates/docker-compose.yml.j2"
    dest: "{{ compose_file_path }}"
    mode: "0644"

- name: Render runtime environment file
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../templates/app.env.j2"
    dest: "{{ runtime_env_file_path }}"
    mode: "0644"

- name: Login to Harbor from the target VM
  ansible.builtin.command:
    argv:
      - docker
      - login
      - "{{ release.harbor.registry }}"
      - --username
      - "{{ harbor_username }}"
      - --password-stdin
    stdin: "{{ harbor_password }}"
  no_log: true
  changed_when: true

- name: Pull the release image with the compatible Compose command
  ansible.builtin.command:
    argv: >-
      {{
        compose_command_argv
        + [
          '--project-name', release.app_name ~ '-' ~ target.name,
          '--file', compose_file_path,
          '--env-file', runtime_env_file_path,
          'pull'
        ]
      }}
  args:
    chdir: "{{ deployment_root }}"
  changed_when: true

- name: Start or update the service with the compatible Compose command
  ansible.builtin.command:
    argv: >-
      {{
        compose_command_argv
        + [
          '--project-name', release.app_name ~ '-' ~ target.name,
          '--file', compose_file_path,
          '--env-file', runtime_env_file_path,
          'up', '--detach', '--remove-orphans'
        ]
      }}
  args:
    chdir: "{{ deployment_root }}"
  changed_when: true

- name: Wait for the health endpoint
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ target.host_port }}{{ target.healthcheck_path }}"
    method: GET
    status_code: 200
  register: deployment_healthcheck
  retries: 12
  delay: 5
  until: deployment_healthcheck.status == 200

- name: Prune stale images according to environment policy
  ansible.builtin.command:
    argv:
      - docker
      - image
      - prune
      - --force
      - --filter
      - until=168h
  when: deployment_environment.docker_image_prune | bool
  changed_when: true
