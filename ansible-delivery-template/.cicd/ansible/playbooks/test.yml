---
- name: Run tests before building a country-specific release
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    country: "{{ lookup('ansible.builtin.env', 'DEPLOY_COUNTRY') | lower }}"
    deploy_env: "{{ lookup('ansible.builtin.env', 'DEPLOY_ENV') | lower }}"
    resolved_project_root: >-
      {{
        lookup('ansible.builtin.env', 'PROJECT_ROOT')
        | default(lookup('ansible.builtin.env', 'GITHUB_WORKSPACE'), true)
        | default(playbook_dir ~ '/../../..', true)
      }}
    # Only localhost tests need a project-local temporary directory.
    ansible_remote_tmp: "{{ resolved_project_root }}/.ansible/remote_tmp"
  vars_files:
    - "{{ playbook_dir }}/../../vars/{{ lookup('ansible.builtin.env', 'DEPLOY_ENV') | lower }}.yml"
    - "{{ playbook_dir }}/../vars/{{ lookup('ansible.builtin.env', 'DEPLOY_COUNTRY') | lower }}/{{ lookup('ansible.builtin.env', 'DEPLOY_ENV') | lower }}.yml"
  pre_tasks:
    - name: Validate selected country, environment, and test command
      ansible.builtin.assert:
        that:
          - country in ['kr', 'eu', 'na']
          - deploy_env in ['stg', 'prd']
          - deployment_environment.code == deploy_env
          - test_stage.command is defined
          - test_stage.command | length > 0
        fail_msg: Check country, deploy environment, and test_stage.command.
  tasks:
    - name: Run the configured project test command
      ansible.builtin.command:
        argv: "{{ test_stage.command }}"
      args:
        chdir: "{{ resolved_project_root }}"
      environment:
        APP_COUNTRY: "{{ country }}"
        APP_ENV: "{{ deploy_env }}"
      changed_when: false
