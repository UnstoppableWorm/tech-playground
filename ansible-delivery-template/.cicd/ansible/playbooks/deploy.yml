---
- name: Deploy a country-specific release to the selected VM group
  hosts: "{{ target.group | default('target_group_required') }}"
  gather_facts: false
  serial: "{{ deployment_environment.deploy_serial | default('100%') }}"
  vars:
    registry_username: "{{ lookup('ansible.builtin.env', 'REGISTRY_USERNAME') }}"
    registry_token: "{{ lookup('ansible.builtin.env', 'REGISTRY_TOKEN') }}"
  pre_tasks:
    - name: Validate selected country, environment, target, and image version
      ansible.builtin.assert:
        that:
          - pipeline.country == country
          - deployment_environment.code == deploy_env
          - target.group in group_names
          - target.deployment_root | length > 0
          - release.app_name | length > 0
          - container_registry.host | default('') | length > 0
          - container_registry.namespace | default('') | length > 0
          - release.image_name | length > 0
          - image_version | default('') is match('^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$')
          - registry_username | default('') | length > 0
          - registry_token | default('') | length > 0
        fail_msg: Check country, deploy environment, inventory target, image_version, and registry credentials.
  tasks:
    - name: Resolve the requested versioned image and deployment paths
      ansible.builtin.set_fact:
        deployment_root: "{{ target.deployment_root }}"
        compose_file_path: "{{ target.deployment_root }}/docker-compose.yml"
        runtime_env_file_path: "{{ target.deployment_root }}/app.env"
        release_repository: "{{ container_registry.host | lower }}/{{ container_registry.namespace | lower }}/{{ release.image_name | lower }}"
        release_image: "{{ container_registry.host | lower }}/{{ container_registry.namespace | lower }}/{{ release.image_name | lower }}:{{ image_version }}"
        deployed_container_name: "{{ release.app_name }}-{{ target.name }}"
        compose_project_name: "{{ release.app_name }}-{{ target.name }}"

    - name: Deploy the current target server
      ansible.builtin.include_tasks: deploy_single_server.yml
