---
- name: Build and push a country-specific release image
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    registry_username: "{{ lookup('ansible.builtin.env', 'REGISTRY_USERNAME') }}"
    registry_token: "{{ lookup('ansible.builtin.env', 'REGISTRY_TOKEN') }}"
    resolved_project_root: "{{ project_root | default(playbook_dir ~ '/../../..', true) }}"
    # The build runs on localhost, unlike the remote deployment playbook.
    ansible_remote_tmp: "{{ resolved_project_root }}/.ansible/remote_tmp"
  pre_tasks:
    - name: Validate selected country, environment, and image version
      ansible.builtin.assert:
        that:
          - pipeline.country == country
          - deployment_environment.code == deploy_env
          - release.app_name | length > 0
          - container_registry.host | default('') | length > 0
          - container_registry.namespace | default('') | length > 0
          - release.image_name | length > 0
          - image_version | default('') is match('^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$')
          - registry_username | default('') | length > 0
          - registry_token | default('') | length > 0
        fail_msg: Check country, deploy environment, image_version, registry settings, and registry credentials.
  tasks:
    - name: Resolve the immutable versioned image name
      ansible.builtin.set_fact:
        release_repository: "{{ container_registry.host | lower }}/{{ container_registry.namespace | lower }}/{{ release.image_name | lower }}"
        release_image: "{{ container_registry.host | lower }}/{{ container_registry.namespace | lower }}/{{ release.image_name | lower }}:{{ image_version }}"
        release_revision: "{{ image_revision | default(image_version, true) }}"
        resolved_dockerfile_path: "{{ resolved_project_root }}/{{ release.dockerfile | default('Dockerfile', true) }}"

    - name: Ensure the Docker build context exists
      ansible.builtin.stat:
        path: "{{ resolved_dockerfile_path }}"
      register: dockerfile_stat

    - name: Stop when the Docker build context is incomplete
      ansible.builtin.assert:
        that:
          - dockerfile_stat.stat.exists
        fail_msg: "Dockerfile not found at {{ resolved_dockerfile_path }}."

    - name: Verify Docker is available on the build runner
      ansible.builtin.command:
        argv:
          - docker
          - version
      changed_when: false

    - name: Login to the container registry from the build runner
      ansible.builtin.command:
        argv:
          - docker
          - login
          - "{{ container_registry.host }}"
          - --username
          - "{{ registry_username }}"
          - --password-stdin
        stdin: "{{ registry_token }}"
      no_log: true
      changed_when: true

    - name: Remove an existing local image with the requested version
      ansible.builtin.command:
        argv:
          - docker
          - image
          - rm
          - --force
          - "{{ release_image }}"
      register: requested_local_image_cleanup
      failed_when: false
      changed_when: requested_local_image_cleanup.rc == 0

    - name: Remove dangling local images before the build
      ansible.builtin.command:
        argv:
          - docker
          - image
          - prune
          - --force
          - --filter
          - dangling=true
      register: dangling_local_image_prune
      changed_when: "'Deleted Images:' in dangling_local_image_prune.stdout"

    - name: Initialize the versioned Docker build command
      ansible.builtin.set_fact:
        docker_build_argv:
          - docker
          - build
          - --pull
          - --file
          - "{{ resolved_dockerfile_path }}"
          - --tag
          - "{{ release_image }}"
          - --label
          - "org.opencontainers.image.version={{ image_version }}"
          - --label
          - "org.opencontainers.image.revision={{ release_revision }}"
          - --build-arg
          - "APP_VERSION={{ image_version }}"

    - name: Add the source repository label when available
      ansible.builtin.set_fact:
        docker_build_argv: >-
          {{
            docker_build_argv
            + [
                '--label',
                'org.opencontainers.image.source=' ~ (image_source | default('', true))
              ]
          }}
      when: image_source | default('', true) | length > 0

    - name: Add country-specific Docker build arguments
      ansible.builtin.set_fact:
        docker_build_argv: >-
          {{
            docker_build_argv
            + ['--build-arg', item.key ~ '=' ~ (item.value | string)]
          }}
      loop: "{{ release.build_args | default({}) | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Add the Docker build context
      ansible.builtin.set_fact:
        docker_build_argv: "{{ docker_build_argv + [resolved_project_root] }}"

    - name: Build the immutable versioned image
      ansible.builtin.command:
        argv: "{{ docker_build_argv }}"
      changed_when: true

    - name: Verify the local image has the requested version tag
      ansible.builtin.command:
        argv:
          - docker
          - image
          - inspect
          - "{{ release_image }}"
      changed_when: false

    - name: Push the immutable versioned image to the container registry
      ansible.builtin.command:
        argv:
          - docker
          - image
          - push
          - "{{ release_image }}"
      changed_when: true

    - name: Report the published image version
      ansible.builtin.debug:
        msg: "Published {{ release_image }} for {{ country }}/{{ deploy_env }}."
