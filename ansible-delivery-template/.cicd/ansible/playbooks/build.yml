---
# Shared build template. Country/environment files provide build_name,
# docker_registry, dockerfile, and optional region_param.
- name: Build and push a country-specific release image
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    country: "{{ lookup('ansible.builtin.env', 'DEPLOY_COUNTRY') | lower }}"
    deploy_env: "{{ lookup('ansible.builtin.env', 'DEPLOY_ENV') | lower }}"
    image_version: "{{ lookup('ansible.builtin.env', 'IMAGE_VERSION') }}"
    image_revision: >-
      {{
        lookup('ansible.builtin.env', 'IMAGE_REVISION')
        | default(lookup('ansible.builtin.env', 'GITHUB_SHA'), true)
        | default(lookup('ansible.builtin.env', 'IMAGE_VERSION'), true)
      }}
    image_source: >-
      {{
        lookup('ansible.builtin.env', 'GITHUB_SERVER_URL')
        ~ '/'
        ~ lookup('ansible.builtin.env', 'GITHUB_REPOSITORY')
        if lookup('ansible.builtin.env', 'GITHUB_REPOSITORY') | length > 0
        else ''
      }}
    registry_namespace: >-
      {{
        lookup('ansible.builtin.env', 'REGISTRY_NAMESPACE')
        | default(lookup('ansible.builtin.env', 'GITHUB_REPOSITORY_OWNER'), true)
      }}
    registry_username: >-
      {{
        lookup('ansible.builtin.env', 'REGISTRY_USERNAME')
        | default(lookup('ansible.builtin.env', 'GITHUB_ACTOR'), true)
      }}
    registry_token: >-
      {{
        lookup('ansible.builtin.env', 'REGISTRY_TOKEN')
        | default(lookup('ansible.builtin.env', 'GITHUB_TOKEN'), true)
      }}
    resolved_project_root: >-
      {{
        lookup('ansible.builtin.env', 'PROJECT_ROOT')
        | default(lookup('ansible.builtin.env', 'GITHUB_WORKSPACE'), true)
        | default(playbook_dir ~ '/../../..', true)
      }}
    # The build runs on localhost, unlike the SSH-based deployment playbook.
    ansible_remote_tmp: "{{ resolved_project_root }}/.ansible/remote_tmp"
  vars_files:
    - "{{ playbook_dir }}/../../pipeline/{{ lookup('ansible.builtin.env', 'DEPLOY_COUNTRY') | lower }}.yml"
    - "{{ playbook_dir }}/../../vars/{{ lookup('ansible.builtin.env', 'DEPLOY_ENV') | lower }}.yml"
    - "{{ playbook_dir }}/../vars/{{ lookup('ansible.builtin.env', 'DEPLOY_COUNTRY') | lower }}/{{ lookup('ansible.builtin.env', 'DEPLOY_ENV') | lower }}.yml"
  pre_tasks:
    - name: Validate selected country, environment, and image version
      ansible.builtin.assert:
        that:
          - pipeline.country == country
          - deployment_environment.code == deploy_env
          - build_name | default('') | length > 0
          - docker_registry | default('') | length > 0
          - registry_namespace | default('') | length > 0
          - dockerfile | default('Dockerfile', true) | length > 0
          - image_version | default('') is match('^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$')
          - registry_username | default('') | length > 0
          - registry_token | default('') | length > 0
        fail_msg: Check country, deploy environment, image version, registry settings, and registry credentials.
  tasks:
    - name: Resolve the immutable versioned image name
      ansible.builtin.set_fact:
        release_repository: "{{ docker_registry | lower }}/{{ registry_namespace | lower }}/{{ build_name | lower }}"
        release_image: "{{ docker_registry | lower }}/{{ registry_namespace | lower }}/{{ build_name | lower }}:{{ image_version }}"
        release_revision: "{{ image_revision | default(image_version, true) }}"
        resolved_dockerfile_path: "{{ resolved_project_root }}/{{ dockerfile | default('Dockerfile', true) }}"

    - name: Ensure the Docker build context exists
      ansible.builtin.stat:
        path: "{{ resolved_dockerfile_path }}"
      register: dockerfile_stat

    - name: Stop when the Docker build context is incomplete
      ansible.builtin.assert:
        that:
          - dockerfile_stat.stat.exists
        fail_msg: "Dockerfile not found at {{ resolved_dockerfile_path }}."

    - name: Verify Docker is available on the build runner
      ansible.builtin.command:
        argv:
          - docker
          - version
      changed_when: false

    - name: Login to the container registry from the build runner
      ansible.builtin.command:
        argv:
          - docker
          - login
          - "{{ docker_registry }}"
          - --username
          - "{{ registry_username }}"
          - --password-stdin
        stdin: "{{ registry_token }}"
      no_log: true
      changed_when: true

    - name: Remove an existing local image with the requested version
      ansible.builtin.command:
        argv:
          - docker
          - image
          - rm
          - --force
          - "{{ release_image }}"
      register: requested_local_image_cleanup
      failed_when: false
      changed_when: requested_local_image_cleanup.rc == 0

    - name: Remove dangling local images before the build
      ansible.builtin.command:
        argv:
          - docker
          - image
          - prune
          - --force
          - --filter
          - dangling=true
      register: dangling_local_image_prune
      changed_when: "'Deleted Images:' in dangling_local_image_prune.stdout"

    - name: Initialize the versioned Docker build command
      ansible.builtin.set_fact:
        docker_build_argv:
          - docker
          - build
          - --pull
          - --file
          - "{{ resolved_dockerfile_path }}"
          - --tag
          - "{{ release_image }}"
          - --label
          - "org.opencontainers.image.version={{ image_version }}"
          - --label
          - "org.opencontainers.image.revision={{ release_revision }}"
          - --build-arg
          - "APP_VERSION={{ image_version }}"

    - name: Add the regional Docker build argument
      ansible.builtin.set_fact:
        docker_build_argv: "{{ docker_build_argv + ['--build-arg', 'REGION_PARAMETER=' ~ region_param] }}"
      when: region_param | default('', true) | length > 0

    - name: Add the source repository label when available
      ansible.builtin.set_fact:
        docker_build_argv: >-
          {{
            docker_build_argv
            + [
                '--label',
                'org.opencontainers.image.source=' ~ (image_source | default('', true))
              ]
          }}
      when: image_source | default('', true) | length > 0

    - name: Add the Docker build context
      ansible.builtin.set_fact:
        docker_build_argv: "{{ docker_build_argv + [resolved_project_root] }}"

    - name: Build the immutable versioned image
      ansible.builtin.command:
        argv: "{{ docker_build_argv }}"
      changed_when: true

    - name: Verify the local image has the requested version tag
      ansible.builtin.command:
        argv:
          - docker
          - image
          - inspect
          - "{{ release_image }}"
      changed_when: false

    - name: Push the immutable versioned image to the container registry
      ansible.builtin.command:
        argv:
          - docker
          - image
          - push
          - "{{ release_image }}"
      changed_when: true

    - name: Report the published image version
      ansible.builtin.debug:
        msg: "Published {{ release_image }} for {{ country }}/{{ deploy_env }}."
