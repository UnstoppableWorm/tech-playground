target:
  group: kr_stg
  name: kr-stg
  deployment_root: /opt/delivery-template/kr-stg
  host_port: 18080
  container_port: 80
  restart_policy: unless-stopped
  healthcheck_path: /
  extra_volumes: []
  runtime_env: {}

release:
  app_name: delivery-template-app
  image_name: delivery-template-app
  dockerfile: Dockerfile
  build_args:
    REGION_PARAMETER: kr
  runtime_env:
    TZ: Asia/Seoul
    APP_REGION: kr
    APP_BASE_URL: https://stg-kr.example.com
    SPRING_PROFILES_ACTIVE: kr,stg
