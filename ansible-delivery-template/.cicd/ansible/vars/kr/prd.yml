target:
  group: kr_prd
  name: kr-prd
  deployment_root: /opt/delivery-template/kr-prd
  host_port: 8080
  container_port: 80
  restart_policy: always
  healthcheck_path: /
  extra_volumes: []
  runtime_env: {}

release:
  app_name: delivery-template-app
  image_name: delivery-template-app
  dockerfile: Dockerfile
  build_args:
    REGION_PARAMETER: kr
  runtime_env:
    TZ: Asia/Seoul
    APP_REGION: kr
    APP_BASE_URL: https://kr.example.com
    SPRING_PROFILES_ACTIVE: kr,prd
