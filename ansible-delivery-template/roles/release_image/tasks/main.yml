- name: Validate build inputs
  ansible.builtin.assert:
    that:
      - harbor_username | length > 0
      - harbor_password | length > 0
      - harbor_registry_host | length > 0
      - app_name | length > 0
      - release_tag | length > 0
    fail_msg: Missing required Harbor or image configuration.

- name: Check Dockerfile path
  ansible.builtin.stat:
    path: "{{ app_dockerfile_path }}"
  register: dockerfile_stat

- name: Ensure Dockerfile exists
  ansible.builtin.assert:
    that:
      - dockerfile_stat.stat.exists
    fail_msg: "Dockerfile not found at {{ app_dockerfile_path }}."

- name: Login to Harbor from the runner
  ansible.builtin.command:
    argv:
      - docker
      - login
      - "{{ harbor_registry_host }}"
      - --username
      - "{{ harbor_username }}"
      - --password-stdin
    stdin: "{{ harbor_password }}"
  no_log: true
  changed_when: true

- name: Build release image
  ansible.builtin.command:
    argv:
      - docker
      - build
      - --pull
      - --tag
      - "{{ release_image }}"
      - --file
      - "{{ app_dockerfile_path }}"
      - .
  args:
    chdir: "{{ app_source_dir }}"
  changed_when: true

- name: Push release image
  ansible.builtin.command:
    argv:
      - docker
      - push
      - "{{ release_image }}"
  changed_when: true
